<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f8fa">
<title>高三历史总复习 · 时间轴</title>
<style>
:root{
 --bg:#f7f8fa;--card:#fff;--text:#15171a;--sub:#66707b;--line:#e7e9ed;
 --soft:#f1f3f5;--ink:#111827;--shadow:0 12px 36px rgba(17,24,39,.07);
 --r:18px;--top:70px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--bg)}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input{font:inherit}
button{touch-action:manipulation}
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:rgba(255,255,255,.92);backdrop-filter:blur(18px);border-right:1px solid var(--line);padding:24px 16px;overflow:auto;overscroll-behavior:contain}
.logo{font-size:19px;font-weight:850;letter-spacing:-.5px;padding:0 8px}
.logo small{display:block;font-size:11px;font-weight:600;color:#9aa1aa;letter-spacing:.08em;margin-top:5px}
.nav{margin-top:24px;display:grid;gap:5px}
.nav button,.era-btn{border:0;background:transparent;text-align:left;padding:10px 11px;border-radius:11px;color:#56606b;cursor:pointer}
.nav button:hover,.nav button.active,.era-btn:hover{background:#f0f2f4;color:#111}
.nav button.active{font-weight:750}
.side-title{font-size:10px;letter-spacing:.15em;color:#9ba2aa;text-transform:uppercase;margin:22px 10px 7px}
.era-btn{display:block;width:100%;font-size:12px;padding:7px 11px}
.main{min-width:0;width:100%;max-width:1320px;margin:auto;padding:24px 30px 80px}
.hero{background:linear-gradient(145deg,#fff,#fbfbfc);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:var(--shadow)}
.eyebrow{font-size:11px;letter-spacing:.13em;color:#9aa1aa;font-weight:750}
h1{font-size:31px;line-height:1.15;letter-spacing:-1px;margin:8px 0 9px}
.hero p{margin:0;color:var(--sub);line-height:1.75;font-size:14px}
.stats{display:flex;gap:20px;margin-top:22px;flex-wrap:wrap}
.stat b{font-size:20px}.stat span{display:block;font-size:11px;color:#9299a2;margin-top:2px}
.tools{position:sticky;top:0;z-index:4;padding:12px 0;background:rgba(247,248,250,.9);backdrop-filter:blur(16px);display:flex;gap:9px;flex-wrap:wrap}
.search{flex:1;min-width:210px;background:#fff;border:1px solid var(--line);outline:none;padding:11px 13px;border-radius:12px;transition:border .15s,box-shadow .15s}
.search:focus{border-color:#cfd4da;box-shadow:0 0 0 4px rgba(17,24,39,.035)}
.segment{display:flex;background:#eceff2;padding:4px;border-radius:12px}
.segment button{border:0;background:transparent;padding:7px 10px;border-radius:8px;color:#626b75;cursor:pointer;white-space:nowrap;font-size:13px}
.segment button.active{background:#fff;color:#111;box-shadow:0 1px 3px rgba(0,0,0,.06);font-weight:750}
.view{display:none}.view.active{display:block;animation:fade .16s ease both}
@keyframes fade{from{opacity:.45;transform:translateY(3px)}to{opacity:1;transform:none}}
.group{content-visibility:auto;contain-intrinsic-size:1px 700px}
.group-head{display:flex;align-items:end;justify-content:space-between;padding:23px 3px 10px}
.group-head h2{font-size:19px;letter-spacing:-.35px;margin:0}
.group-head span{font-size:11px;color:#9aa1aa}
.timeline{position:relative;padding-left:29px}
.timeline:before{content:"";position:absolute;left:7px;top:0;bottom:4px;width:1px;background:#dde1e5}
.event{position:relative;background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px 16px;margin-bottom:9px;cursor:pointer;transition:transform .12s ease,border-color .12s ease,box-shadow .12s ease;contain:content}
.event:before{content:"";position:absolute;left:-27px;top:22px;width:8px;height:8px;border-radius:50%;background:#252a31;border:3px solid var(--bg)}
.event:hover{transform:translateY(-1px);border-color:#d3d7dc;box-shadow:0 7px 22px rgba(17,24,39,.055)}
.event:active{transform:scale(.997)}
.e-row{display:grid;grid-template-columns:104px 1fr auto;gap:11px;align-items:start}
.e-date{font-size:11px;color:#8f969f;padding-top:2px}
.e-title{font-size:15px;font-weight:790;letter-spacing:-.15px}
.e-star{font-size:11px;letter-spacing:.5px}
.e-summary{margin:8px 0 0 115px;color:#66707b;font-size:13px;line-height:1.6}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0 0 115px}
.chip{font-size:10px;padding:4px 7px;border:1px solid #eceef0;border-radius:99px;background:#f6f7f8;color:#626b75}
.hidden{display:none!important}
.empty{text-align:center;color:#9aa1aa;padding:70px 10px}
.system-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
.system{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;content-visibility:auto}
.system h3{margin:0 0 9px;font-size:15px}.system p{font-size:13px;line-height:1.75;color:#626b75;margin:0}
.system .take{border-top:1px dashed var(--line);margin-top:11px;padding-top:11px;color:#20252a;font-weight:650}
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.compare-col{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}
.compare-col h3{margin:0 0 12px;font-size:15px}
.c-item{padding:10px 0;border-top:1px solid #f0f1f3}.c-item:first-of-type{border-top:0}
.c-item b{display:block;font-size:13px}.c-item span{font-size:11px;color:#8d949d}
.detail{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;transform:translateX(102%);transition:transform .22s cubic-bezier(.2,.8,.2,1);will-change:transform}
.detail.open{transform:none}
.detail-top{position:sticky;top:0;z-index:2;background:rgba(247,248,250,.9);backdrop-filter:blur(18px);border-bottom:1px solid rgba(231,233,237,.8)}
.detail-bar{max-width:920px;margin:auto;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.back{border:0;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 11px;cursor:pointer}
.detail-main{max-width:920px;margin:auto;padding:35px 20px 90px}
.d-meta{font-size:12px;color:#8f969f;margin-bottom:8px}.d-title{font-size:32px;font-weight:870;letter-spacing:-1px;line-height:1.15;margin:0}
.d-summary{font-size:16px;color:#59636e;line-height:1.85;margin:15px 0 25px}
.d-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.d-card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px;min-width:0}
.d-card.full{grid-column:1/-1}.d-card h3{font-size:12px;letter-spacing:.09em;color:#8c939c;margin:0 0 11px}
.d-card p,.d-card li{font-size:14px;line-height:1.8;color:#353b43}
.d-card p{margin:0}.d-card ul{margin:0;padding-left:18px}
.keyword-wrap{display:flex;gap:7px;flex-wrap:wrap}
.keyword{background:#111827;color:#fff;border-radius:999px;padding:6px 9px;font-size:11px}
.linkline{display:flex;gap:6px;flex-wrap:wrap}
.linkpill{background:#f2f4f6;border:1px solid #e8eaed;border-radius:9px;padding:7px 9px;font-size:12px;color:#414952}
.fastbox{background:#111827;color:#fff!important;border:0}.fastbox h3{color:#aeb6c0}.fastbox p{color:#fff;font-size:15px;font-weight:650}
.progress{position:fixed;left:0;top:0;height:2px;background:#111827;z-index:50;width:0}
.mobile-tabs{display:none}
@media(max-width:820px){
 .shell{display:block}.side{display:none}.main{padding:12px 12px 90px}.hero{padding:22px 17px;border-radius:19px}
 h1{font-size:26px}.tools{top:0;padding:9px 0}.search{width:100%;flex-basis:100%}
 .e-row{grid-template-columns:86px 1fr auto}.e-summary,.chips{margin-left:97px}
 .system-grid,.d-grid,.compare-grid{grid-template-columns:1fr}.d-card.full{grid-column:auto}
 .d-title{font-size:28px}.detail-main{padding:25px 14px 80px}.detail-bar{padding:0 14px}
 .mobile-tabs{position:fixed;display:grid;grid-template-columns:repeat(3,1fr);left:10px;right:10px;bottom:10px;z-index:8;background:rgba(255,255,255,.92);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:15px;padding:5px;box-shadow:0 10px 30px rgba(0,0,0,.1)}
 .mobile-tabs button{border:0;background:transparent;border-radius:10px;padding:9px 5px;font-size:12px;color:#69727c}
 .mobile-tabs button.active{background:#f0f2f4;color:#111;font-weight:750}
}
@media(max-width:520px){
 .e-row{grid-template-columns:76px 1fr auto;gap:8px}.e-summary,.chips{margin-left:84px}
 .segment button{padding:7px 8px}.hero p br{display:none}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
</head>

<div class="progress" id="progress"></div>
<div class="shell">
<aside class="side">
 <div class="logo">历史总复习<small>CHINA × WORLD · TIMELINE</small></div>
 <div class="nav">
  <button class="active" data-view="timeline">总时间轴</button>
  <button data-view="systems">体系主线</button>
  <button data-view="compare">中外同期</button>
 </div>

 <div class="side-title">世界史阶段</div><div id="worldNav"></div>

<main class="main">
 <section class="hero">

  <div class="stats"><div class="stat"><b id="eventCount"></b><span>知识节点</span></div><div class="stat"><b>8</b><span>核心体系</span></div><div class="stat"><b>3级</b><span>重要度</span></div></div>
 </section>
 <div class="tools" id="tools">

  <div class="segment" id="starSeg"><button class="active" data-star="0">全部</button><button data-star="3">★★★</button><button data-star="2">★★+</button></div>
 </div>
 <section class="view active" id="timelineView"><div id="timelineHost"></div></section>
 <section class="view" id="systemsView"><div class="group-head"><h2>体系主线</h2><span>大题串联</span></div><div class="system-grid" id="systemHost"></div></section>
 <section class="view" id="compareView"><div class="group-head"><h2>中外同期对照</h2><span>同一时代一起看</span></div><div id="compareHost"></div></section>
</main>
</div>
<div class="mobile-tabs">
 <button class="active" data-view="timeline">时间线</button><button data-view="systems">体系</button><button data-view="compare">中外同期</button>
</div>

<section class="detail" id="detail" aria-hidden="true">
 <div class="detail-top"><div class="detail-bar"><button class="back" id="backBtn">← 返回总览</button><span id="detailStar"></span></div></div>
 <main class="detail-main" id="detailMain"></main>
</section>

const DEEP_POINTS={"农业产生与定居生活":["【农业】中国早期农业形成“北粟南稻”格局，农业生产使人类由采集狩猎逐渐走向定居生活。","【社会】定居和剩余产品增加推动人口增长、手工业分化和聚落扩大，为阶级分化与早期国家形成创造条件。","【文明】中华文明起源呈现多元分布、相互交流并逐渐汇聚的特点，不能理解成只有单一中心。"],"夏朝建立":["【政治】传统文献一般把夏视为中国最早的王朝，王位世袭逐渐取代禅让，政治权力开始家族化。","【国家】出现宫殿、城址、阶级分化等早期国家特征，是从部落联盟向国家形态发展的重要阶段。","【辨析】高考通常重在“早期国家形成、世袭制”而不是死背具体君王世系。"],"商朝":["【文字】甲骨文是较成熟的文字体系，是研究商代历史的一手材料，也是汉字发展重要源头。","【政治】商王通过内外服等方式控制不同区域，王权与神权结合明显。","【经济文化】青铜铸造水平高，礼器体现等级秩序和政治权力。"],"西周建立":["【分封制】周天子把土地和人口分封给王族、功臣、先代贵族；诸侯承担朝觐、纳贡、军役等义务。","【宗法制】以嫡长子继承为核心，用血缘关系维系政治等级，解决贵族内部权力与财产继承问题。","【礼乐制】通过礼仪和乐制规范贵族等级秩序，与分封、宗法共同构成西周政治体系。","【影响】前期有利于扩大周文化和政治影响；后期随着诸侯实力增长，王室权威下降。","【比较】分封制是贵族世袭政治；秦郡县制下地方长官由中央任免，体现官僚政治。"],"春秋战国：社会大变革":["【经济】铁制农具和牛耕推广提高生产力，井田制逐渐瓦解，土地私有和小农经济发展。","【政治】周王室衰微，诸侯争霸兼并；各国通过变法强化君主权力，县制和官僚政治逐渐发展。","【阶层】旧贵族地位下降，士阶层活跃，社会流动增强。","【思想】社会秩序重建需求推动百家争鸣，形成儒、墨、道、法等思想体系。","【总特征】这是从奴隶制贵族政治向封建社会、中央集权趋势转变的重要社会转型期。"],"商鞅变法":["【经济】废井田、承认土地私有，奖励耕织，推动农业生产和国家赋税能力提高。","【军事】奖励军功，按军功授爵，削弱旧贵族世袭特权并提升军队战斗力。","【政治】推行县制、什伍连坐和户籍管理，加强国家对地方和基层社会控制。","【影响】实现富国强兵，为秦统一六国奠定基础；也体现战国时期中央集权和官僚政治的发展。"],"百家争鸣":["【儒家】孔子主张仁、克己复礼和有教无类；孟子主张仁政、民贵君轻；荀子强调礼法结合。","【道家】老子主张“道”、无为而治，强调顺应自然和辩证思维。","【墨家】墨子主张兼爱、非攻、尚贤，代表下层平民和小生产者部分诉求。","【法家】韩非强调法、术、势和君主集权，适应战国富国强兵与统一趋势。","【原因】社会大变革、士阶层崛起、各国招揽人才共同推动思想活跃。"],"秦统一六国":["【统一条件】长期兼并使统一趋势增强；各地区经济文化联系加强；秦经商鞅变法实力最强。","【中央】确立皇帝制度和三公九卿制，最高权力集中于皇帝。","【地方】全面推行郡县制，郡县长官由中央任免，实现中央垂直管理。","【统一措施】统一文字、货币、度量衡、车轨等，促进全国经济文化联系。","【意义】建立中国历史上第一个统一多民族中央集权国家，奠定后世大一统制度基本框架。"],"汉朝巩固大一统":["【政治】汉武帝实行推恩令削弱诸侯王，设置刺史监察地方，以中朝加强皇权。","【经济】盐铁官营、均输平准等措施加强中央财政和经济控制。","【思想】尊崇儒术，使儒学逐渐成为国家主流意识形态，但并非其他思想完全消失。","【边疆】北击匈奴、经营西域，扩大统一多民族国家的影响。","【制度线】体现秦建立中央集权后，汉朝进一步解决地方割据和思想整合问题。"],"张骞通西域与丝绸之路":["【时间】汉武帝时期张骞两次出使西域，增强汉朝对西域地理、政治和交通状况的了解。","【交通】陆上丝绸之路沟通中国、中亚、西亚乃至欧洲，丝绸等商品大量外传。","【交流】不仅交换商品，也传播技术、物种、宗教和艺术。","【政治】加强中央王朝与西域联系，为后来西域治理奠定基础。"],"分裂、民族交融与江南开发":["【政治格局】三国两晋南北朝长期分裂，但也出现局部统一和重新统一趋势。","【民族交融】北方民族迁徙、政权更替和长期共同生活推动各民族在制度、语言、生活方式上相互影响。","【江南开发】北方战乱促使人口南迁，带来劳动力、技术和生产经验，南方农业手工业快速发展。","【经济线】这是经济重心南移的早期重要阶段，但南移完成要到南宋。"],"北魏孝文帝改革":["【措施】迁都洛阳，改汉姓、穿汉服、说汉语，推动鲜卑贵族与汉族通婚并采用中原制度。","【目的】强化北魏统治、适应中原社会治理需要。","【影响】促进北方民族交融和社会经济恢复，为隋唐统一与民族融合创造条件。","【辨析】民族交融是双向过程，不宜简单理解成单向“汉化”。"],"隋统一":["【背景】魏晋南北朝后期南北经济联系和民族交融增强，重新统一条件成熟。","【意义】结束长期分裂局面，重建大一统国家，为唐代制度完善与繁荣奠定基础。","【制度】隋代在三省六部、科举等制度方面具有承前启后作用。"],"三省六部制与科举制":["【三省】中书省负责草拟政令，门下省负责审核，尚书省负责执行，尚书省下设六部。","【作用】相权被分割，三省相互配合制约，有利于加强皇权和提高行政效率。","【科举】以考试成绩选拔官员，隋创立、唐完善，中央掌握选官权。","【影响】扩大统治基础和社会流动，削弱门阀士族对仕途的垄断。","【辨析】三省制不是近代三权分立；科举也不是一开始就完全消除门第影响。"],"唐朝：开放与繁荣":["【政治经济】统一稳定、制度成熟和经济发展为盛唐繁荣奠定基础。","【民族】采取较灵活开放的民族政策，通过册封、和亲、设置机构等方式加强联系。","【对外】长安国际化程度高，遣唐使、玄奘西行、鉴真东渡体现中外文化双向交流。","【阶段特征】统一、繁荣、开放、民族交融是隋唐高频概括词。"],"安史之乱":["【原因】唐玄宗后期政治问题加重，节度使兼具军政财权，边镇势力膨胀。","【时间】755—763年，安禄山、史思明发动叛乱。","【政治影响】中央集权受损，藩镇割据问题加重，唐朝由盛转衰。","【经济影响】北方经济遭到破坏，人口与经济活动进一步南移，加速经济重心南移。"],"宋代加强中央集权":["【背景】唐末五代长期藩镇割据和武将专权，使宋初特别重视削弱地方和军事势力。","【军事】收精兵、控制调兵权，防止武将拥兵自重。","【行政】中央分割宰相权力；地方设置转运、司法等官员分权，加强中央控制。","【特点】强干弱枝、重文轻武。","【评价】有利于结束割据、保持政局稳定，但也造成机构重叠、军费财政压力和军队战斗力问题。"],"宋代商品经济与城市繁荣":["【城市】坊市界限和营业时间限制明显松动，夜市、晓市、草市繁荣。","【货币】商品交易扩大推动纸币出现，北宋四川地区出现交子。","【海外贸易】海港和海上贸易发展，政府设置市舶司管理海外贸易。","【社会】商品经济发展推动市民阶层扩大，文学艺术出现更明显的世俗化、大众化。","【辨析】商业繁荣不等于中国已经进入资本主义社会。"],"经济重心南移完成":["【过程】魏晋南北朝江南开发 → 唐中后期南移加快 → 南宋经济重心基本完成南移。","【原因】北方战乱和人口南迁；南方自然条件优越；劳动力和技术输入；南方社会相对稳定。","【表现】南方农业、手工业、商业和财政收入在全国地位显著上升。","【影响】人口、城市和文化教育重心也更多向南方转移。"],"元朝与行省制":["【行省】除中书省直辖地区外，在地方设置行中书省，行省长官受中央节制。","【意义】适应元朝辽阔疆域治理，加强中央对地方管理，对后世省制影响深远。","【边疆】在西藏地区设置中央管理机构，在澎湖设置巡检司管理台湾附近岛屿。","【主线】体现大一统国家疆域扩大后地方行政制度的新调整。"],"明朝建立与废丞相":["【废丞相】明太祖废除中书省和丞相，六部直接对皇帝负责，皇权进一步集中。","【内阁】后来形成内阁帮助皇帝处理政务，阁臣可票拟，但最终决策权和批红权掌握在皇帝手中。","【辨析】内阁不是法定中央最高行政机构，也不能等同于宰相制度。","【趋势】是中国古代皇权不断加强、相权持续削弱的重要节点。"],"军机处":["【设立】雍正时期为处理军务设置，后来成为皇帝处理重要政务的辅助机构。","【特点】人员少、办事快、保密性强，军机大臣主要负责跪受笔录、上传下达。","【权力】没有独立决策权，决策权仍集中于皇帝。","【意义】体现清代君主专制进一步强化。"],"商品经济发展与新经营方式":["【农业】高产作物传播，农产品商品化程度提高。","【手工业】部分地区出现以雇佣劳动为特征的新经营方式，但规模和范围有限。","【商业】长途贩运、商帮、工商业市镇发展，白银成为重要流通货币。","【辨析】这些变化说明传统经济内部出现新因素，但不能直接推导为中国已经进入资本主义社会。"],"清代边疆治理":["【台湾】1683年统一台湾，1684年设台湾府，加强东南海疆治理。","【西藏】册封达赖、班禅，1727年设驻藏大臣，中央对西藏治理制度化。","【新疆】平定准噶尔和大小和卓叛乱，设置伊犁将军。","【东北】1689年中俄《尼布楚条约》划定部分东段边界。","【意义】多种治理方式并用，统一多民族国家疆域进一步巩固。"],"鸦片战争":["【国际背景】英国完成工业革命后急需扩大海外市场和原料来源，对华贸易和殖民扩张压力增强。","【直接过程】林则徐禁烟后，英国以此为借口发动战争；清军战败。","【条约】1842年《南京条约》割香港岛、赔款、开放五口、协定关税等，国家主权遭破坏。","【社会影响】中国开始沦为半殖民地半封建社会，自然经济开始逐步解体，被迫卷入资本主义世界市场。","【历史定位】1840年是中国近代史开端，不能把根本原因只写成禁烟冲突。"],"第二次鸦片战争":["【原因】英法等列强不满足第一次鸦片战争获得的权益，要求进一步扩大在华市场和特权。","【过程】1856—1860年英法联军发动战争，最终攻入北京。","【影响】更多通商口岸开放，外国势力进一步深入中国内地，主权损失扩大。","【定位】中国半殖民地化程度进一步加深。"],"太平天国":["【背景】鸦片战争后社会矛盾激化，清政府统治危机和农民负担加重。","【纲领】《天朝田亩制度》具有平均主义色彩；《资政新篇》提出部分近代化设想。","【影响】沉重打击清朝统治，也加剧社会经济破坏。","【局限】农民阶级自身局限、内部斗争和缺乏科学纲领是失败的重要原因。"],"洋务运动":["【背景】第二次鸦片战争和太平天国运动使清政府面临“内忧外患”。","【思想】以“中体西用”为指导，主张在维护封建政治伦理前提下学习西方技术。","【内容】创办近代军事工业和民用工业，建设海军，兴办新式学堂、派遣留学生。","【口号】前期“自强”，后期“求富”。","【评价】开启中国早期现代化，在工业、军事、教育方面有开创作用；但未根本改变封建制度，甲午战败暴露其局限。"],"甲午中日战争":["【背景】明治维新后日本走向对外扩张；列强进入帝国主义扩张阶段；朝鲜问题成为冲突焦点。","【结果】清政府战败，签订《马关条约》，割地赔款、增开商埠并允许日本在华设厂。","【经济含义】允许设厂反映列强对华侵略由商品输出进一步转向资本输出。","【政治影响】民族危机大大加深，列强掀起瓜分中国狂潮。","【思想影响】洋务运动局限彻底暴露，推动维新变法和新的救亡探索，是近代中国的重要转折。"],"戊戌变法":["【背景】甲午战败和瓜分危机使维新派认识到只学技术不足以救国。","【主张】康有为、梁启超等要求政治制度改革、发展工商业和新式教育，具有君主立宪倾向。","【过程】1898年光绪帝推动百日维新，随后因守旧势力反扑而失败。","【意义】虽然政治改革失败，但推动思想启蒙和近代制度探索。","【主线】近代化探索由“器物”层面进一步进入“制度”层面。"],"八国联军侵华与《辛丑条约》":["【背景】列强侵略加深、民族矛盾激化，义和团运动兴起。","【战争】1900年八国联军侵华并攻入北京。","【条约】1901年《辛丑条约》规定巨额赔款、允许列强驻兵等，严重损害主权。","【定位】清政府进一步成为列强控制中国的工具，中国完全陷入半殖民地半封建社会深渊。"],"辛亥革命与中华民国":["【条件】民族资本主义发展、革命思想传播、同盟会等革命组织建立、清政府危机加深。","【过程】1911年武昌起义后多省响应；1912年中华民国成立。","【功绩】推翻清王朝，结束中国两千多年君主专制制度，建立共和政体，传播民主共和观念。","【局限】革命果实被袁世凯窃取，未完成反帝反封建任务，也未改变半殖民地半封建社会性质。","【辨析】结束的是“君主专制制度”，不能简单写成“结束封建制度”。"],"新文化运动":["【背景】辛亥革命后共和政治未能解决现实危机，一批知识分子开始反思传统思想文化。","【阵地人物】《新青年》是重要阵地，陈独秀、李大钊、胡适、鲁迅等积极参与。","【内容】提倡民主与科学，反对旧道德旧文化；推动文学革命和白话文。","【影响】促进思想解放，为马克思主义传播和五四运动准备思想条件。","【局限】部分观点存在对传统文化过度否定倾向。"],"五四运动":["【导火索】巴黎和会拒绝中国正当要求，决定把德国在山东的权益转交日本。","【过程】学生运动首先爆发，随后工人阶级参加并成为重要力量，运动中心由北京转向上海。","【性质】彻底反帝反封建的伟大爱国革命运动，同时具有广泛社会动员和思想启蒙意义。","【意义】工人阶级登上政治舞台，马克思主义进一步传播，是中国新民主主义革命的开端。","【串联】巴黎和会 → 五四运动 → 马克思主义传播 → 1921年中共成立。"],"中国共产党成立":["【条件】马克思主义广泛传播、工人运动发展、早期共产党组织建立。","【时间】1921年中共一大召开，中国共产党成立。","【意义】中国革命有了新的领导力量和科学理论指导，中国革命面貌焕然一新。","【主线】与五四运动、工人阶级成长、马克思主义中国传播密切相关。"],"国民革命与北伐":["【合作】1924年第一次国共合作正式形成，推动国民革命运动。","【北伐】1926年北伐，主要打击北洋军阀势力，革命势力迅速发展。","【群众】工农运动高涨，扩大革命社会基础。","【结局】1927年国民党右派发动反革命政变，第一次国共合作破裂，大革命失败。","【意义】中共认识到掌握革命武装和独立领导革命的重要性。"],"井冈山道路":["【转折背景】1927年大革命失败后，城市起义接连受挫，中共需要重新探索革命道路。","【武装斗争】南昌起义打响武装反抗国民党反动派第一枪；秋收起义后转向农村。","【根据地】井冈山革命根据地创建，开展土地革命和根据地建设。","【道路】逐渐形成农村包围城市、武装夺取政权的革命道路。","【方法】体现把马克思主义基本原理同中国具体国情相结合。"],"长征与遵义会议":["【原因】第五次反“围剿”失利，中央红军被迫进行战略转移。","【遵义会议】1935年召开，纠正“左”倾军事错误，开始确立以毛泽东为主要代表的马克思主义正确路线在党中央的领导地位。","【意义】在危急关头挽救党、红军和中国革命，是中共从幼年走向成熟的重要标志。","【长征意义】保存革命骨干力量，传播革命思想，实现战略转移。"],"九一八事变与抗日民族统一战线形成":["【九一八】1931年日本发动九一八事变，侵占中国东北，民族危机急剧加深。","【一二九等】抗日救亡运动不断发展，停止内战、一致抗日逐渐成为社会要求。","【西安事变】1936年西安事变和平解决，成为扭转时局的重要枢纽。","【统一战线】国共由内战对抗逐步转向合作抗日，为全民族抗战准备政治条件。"],"全民族抗战":["【开始】1937年七七事变后，日本发动全面侵华战争，中国全民族抗战开始。","【合作】第二次国共合作形成抗日民族统一战线。","【正面战场】淞沪、太原、徐州、武汉等会战牵制日军；台儿庄取得重要胜利。","【敌后战场】中共建立抗日根据地，开展游击战争，百团大战等沉重打击日军。","【胜利原因】全民族抗战是根本；国共合作、两个战场配合、国际反法西斯力量支持等共同作用。","【意义】是近代中国抗击外敌入侵第一次取得完全胜利的民族解放战争，中国国际地位提高。"],"解放战争":["【背景】抗战胜利后国共围绕国家前途和政权问题矛盾加剧，和平建国努力破裂。","【战略变化】人民解放军由战略防御转入战略进攻，再到战略决战。","【三大战役】辽沈、淮海、平津三大战役基本消灭国民党军队主力。","【渡江】1949年渡江战役推翻国民党政权在大陆的统治。","【原因】政治、经济、军事、民心等多重因素共同决定战争结果。"],"中华人民共和国成立":["【时间】1949年10月1日开国大典，中华人民共和国成立。","【政治意义】结束帝国主义、封建主义和官僚资本主义长期压迫，中国人民成为国家主人。","【国际意义】改变世界政治力量对比，壮大社会主义和民族解放力量。","【辨析】1949年是新中国成立；社会主义基本制度建立要到1956年三大改造基本完成。"],"一五计划":["【时间】1953—1957年实施第一个五年计划。","【重点】优先发展重工业，集中建设一批基础工业和国防工业项目。","【原因】新中国工业基础薄弱，需要建立独立工业体系和国防能力。","【意义】我国开始改变工业落后面貌，社会主义工业化建设取得重要进展。","【辨析】一五计划解决的是工业化建设问题，与三大改造的所有制变革要区分。"],"三大改造":["【对象】农业、手工业、资本主义工商业。","【方式】农业和手工业合作化；资本主义工商业通过公私合营等形式进行改造。","【结果】1956年底基本完成，生产资料私有制社会主义改造取得决定性胜利。","【意义】社会主义基本制度在中国建立，中国进入社会主义社会。","【辨析】三大改造强调所有制变革；一五计划强调工业化建设。"],"第一届全国人大与1954年宪法":["【时间】1954年第一届全国人民代表大会召开。","【宪法】通过《中华人民共和国宪法》，体现人民民主和社会主义原则。","【制度】人民代表大会制度作为我国根本政治制度进一步确立。","【体系】与中国共产党领导的多党合作和政治协商制度、民族区域自治制度共同构成重要政治制度框架。"],"外交突破":["【1971】第26届联合国大会恢复中华人民共和国在联合国的一切合法权利。","【1972中美】尼克松访华，中美发表《上海公报》，两国关系开始走向正常化。","【1972中日】中日实现邦交正常化。","【意义】中国外交空间扩大，国际地位进一步提高，为改革开放时期外部环境改善奠定基础。"],"十一届三中全会":["【时间】1978年12月召开。","【思想路线】重新确立解放思想、实事求是的思想路线。","【工作重心】把党和国家工作重点转移到社会主义现代化建设上来。","【决策】作出实行改革开放的历史性决策。","【意义】成为新中国成立以来具有深远意义的伟大转折，开启改革开放和社会主义现代化建设新时期。"],"农村与城市经济体制改革":["【农村】家庭联产承包责任制把经营自主权更多交给农户，但土地集体所有性质不变。","【作用】调动农民生产积极性，促进农业增产和农村经济发展。","【城市】扩大国有企业经营自主权，逐步推进所有权与经营权适当分离。","【方向】改革的本质是调整不适应生产力发展的体制机制，而不是改变社会主义制度。"],"对外开放格局形成":["【起点】1980年设深圳、珠海、汕头、厦门经济特区。","【扩展】开放沿海港口城市、沿海经济开放区，之后逐步向沿江、沿边和内地扩大。","【格局】形成全方位、多层次、宽领域的对外开放格局。","【作用】引进资金、技术和管理经验，扩大外贸，加快现代化建设。"],"南方谈话与社会主义市场经济目标":["【南方谈话】1992年邓小平南方谈话进一步回答“什么是社会主义、怎样建设社会主义”等重大问题，推动思想解放。","【十四大】1992年中共十四大明确提出建立社会主义市场经济体制的改革目标。","【意义】改革开放进入新的发展阶段，市场在资源配置中的作用不断增强。","【辨析】计划和市场都是经济手段，社会主义也可以发展市场经济。"],"加入世界贸易组织":["【时间】2001年中国加入世界贸易组织。","【意义】中国更深程度参与经济全球化和国际分工，开放型经济进入新阶段。","【影响】既扩大市场、贸易、投资机会，也要求国内产业面对更强国际竞争。"],"两河流域文明":["【地理】幼发拉底河和底格里斯河流域是世界早期文明中心之一。","【政治】早期城市国家和君主统治发展。","【法律】《汉谟拉比法典》是古代较完整成文法典的重要代表，维护奴隶主阶级统治和社会等级。","【文明比较】大河文明通常与农业灌溉、集权管理和早期国家形成密切相关。"],"古埃及文明":["【地理】尼罗河定期泛滥为农业提供条件，推动古埃及文明发展。","【政治】法老拥有高度集中的政治和宗教权威。","【文化】金字塔、象形文字和历法体现其工程、文字和科学成就。"],"古印度文明与种姓制度":["【等级】种姓制度分婆罗门、刹帝利、吠舍、首陀罗等等级，社会身份具有世袭性和严格限制。","【宗教】佛教反对婆罗门特权和繁琐祭祀，后广泛传播到亚洲多地。","【考法】重点在社会结构与宗教思想之间关系。"],"雅典民主政治":["【主体】雅典民主是成年男性公民的民主，妇女、奴隶和外邦人没有公民权。","【形式】公民直接参加公民大会等政治活动，属于直接民主。","【积极】提高公民参与度，推动政治文化和思想发展。","【局限】公民范围狭窄，并非现代意义上的全民民主。","【比较】现代代议制民主以选举代表和法治制度为基础，与雅典直接民主不同。"],"罗马法传统":["【起点】《十二铜表法》使法律由习惯法走向成文法，限制贵族随意解释法律。","【发展】随着疆域扩大，法律从适用于罗马公民的公民法发展到更广泛的万民法。","【集成】《查士丁尼民法大全》系统整理罗马法成果。","【影响】罗马法中的私法、契约、财产等原则对近现代欧洲大陆法系影响深远。"],"西欧封建社会":["【政治】封君封臣制以土地封赐和效忠义务为纽带，政治权力较分散。","【经济】庄园是基本经济和社会单位，自给自足特征明显。","【宗教】基督教会拥有广泛土地、政治和文化影响。","【变化】10—11世纪后城市和商业复兴，市民阶层、大学和自治城市发展，推动中世纪社会变化。"],"阿拉伯帝国与东西方交流":["【宗教】7世纪伊斯兰教兴起并推动阿拉伯半岛统一。","【帝国】阿拉伯帝国横跨亚非欧，形成广阔贸易和文化网络。","【交流】吸收希腊、波斯、印度、中国等文明成果，并向欧洲传播数学、医学、哲学等知识。","【定位】阿拉伯世界是中古时期东西方文明交流的重要桥梁。"],"文艺复兴":["【背景】意大利商品经济和城市发展，新兴资产阶级壮大，古典文化资源丰富。","【核心】人文主义，肯定人的价值、尊严和现实生活，反对教会对人的过度束缚。","【代表】但丁、彼特拉克、薄伽丘、达·芬奇、米开朗琪罗、莎士比亚等。","【实质】不是简单复古，而是借古希腊罗马文化表达新兴资产阶级的时代精神。","【影响】推动思想解放，为宗教改革、科学革命和启蒙运动创造文化条件。"],"新航路开辟":["【动因】欧洲商品经济发展和黄金需求；传统商路受阻；传播基督教；王室支持。","【条件】造船航海技术进步、地理知识积累、指南针应用。","【航海家】迪亚士到好望角；哥伦布到美洲；达·伽马到印度；麦哲伦船队完成环球航行。","【世界影响】世界各地区联系显著加强，人类社会由相对分散逐渐走向整体，世界市场开始形成。","【双重性】欧洲商业革命和资本积累加速，同时伴随殖民掠夺、奴隶贸易和原住民灾难。"],"宗教改革":["【背景】天主教会腐败和经济政治特权引发不满，民族国家发展，人文主义传播。","【路德】提出因信称义，反对教皇和教会垄断人的得救权。","【影响】打击罗马教廷权威，促进思想解放和民族国家发展，也推动文化教育传播。","【辨析】宗教改革不是否定宗教，而是改革基督教制度和教会权威。"],"英国资产阶级革命与君主立宪":["【背景】资本主义发展与斯图亚特王朝专制统治矛盾加剧，议会与王权冲突。","【过程】1640年革命开始，经历内战和共和国等阶段，1688年光荣革命完成关键政治转折。","【权利法案】1689年《权利法案》限制王权，确立议会在政治中的重要地位。","【制度】英国君主立宪制此后逐步形成和完善，国王“统而不治”是长期演变结果。","【辨析】1689年不是所有现代民主制度一次性完全确立。"],"启蒙运动":["【背景】资本主义进一步发展，自然科学进步，专制制度与教会权威受到批判。","【核心】理性主义，以人的理性审视政治、宗教和社会制度。","【代表】孟德斯鸠主张三权分立；卢梭主张人民主权和社会契约；伏尔泰倡导自由、宽容并反对教权。","【影响】为欧美资产阶级革命和近代政治制度提供思想武器。","【比较】文艺复兴强调人的价值；启蒙运动更直接讨论如何建立理性政治社会制度。"],"美国独立与1787年宪法":["【独立】1776年《独立宣言》宣告北美殖民地独立并宣扬天赋人权思想。","【宪法】1787年宪法确立联邦制共和国，并以行政、立法、司法分权制衡防止权力过度集中。","【意义】建立较稳定的资产阶级共和制度，为资本主义发展创造政治条件。","【局限】当时奴隶制仍存在，妇女、黑人、原住民等政治权利受到严重限制。"],"法国大革命":["【背景】封建等级制度和财政危机加深，启蒙思想广泛传播。","【1789】法国大革命爆发，《人权宣言》宣扬自由、平等和人民主权。","【拿破仑】通过战争传播部分革命原则，同时也带有对外扩张性质。","【法典】《拿破仑法典》确认财产权和法律面前平等等资产阶级法权原则。","【影响】沉重打击欧洲封建制度，传播近代民族和民主思想。"],"第一次工业革命":["【为什么英国先发生】政治稳定、资本积累、海外市场、劳动力、煤铁资源和技术创新等条件共同作用。","【技术】珍妮纺纱机等机器革新，瓦特改良蒸汽机使蒸汽成为主要动力，铁路和蒸汽船改变交通。","【生产组织】机器生产和工厂制度逐渐取代手工工场。","【社会】工业资产阶级和工人阶级壮大，城市化加速，同时出现贫富分化、劳动条件恶劣和环境问题。","【世界】工业国扩大原料和市场需求，殖民扩张加快，资本主义世界市场基本形成。"],"第二次工业革命":["【时间】19世纪70年代至20世纪初。","【技术】电力广泛应用、内燃机、化学工业、钢铁工业、电讯技术迅速发展。","【特点】科学研究与工业生产联系更加紧密；多个国家同时推进；重工业比重上升。","【企业】资本和生产进一步集中，垄断组织形成。","【国际】主要资本主义国家进入帝国主义阶段，争夺殖民地和世界市场加剧，世界市场最终形成。"],"《共产党宣言》发表":["【时间】1848年马克思、恩格斯发表《共产党宣言》。","【理论】系统阐述阶级斗争、无产阶级历史使命和共产主义目标。","【意义】标志马克思主义诞生，工人运动开始有科学理论指导。","【背景】工业革命后工人阶级壮大、劳资矛盾突出和欧洲工人运动发展。"],"巴黎公社":["【时间】1871年巴黎工人建立公社政权。","【措施】废除旧军队和部分旧官僚机构，实行公职人员选举等措施。","【意义】是无产阶级建立政权的第一次伟大尝试，为马克思主义国家理论提供实践经验。","【辨析】巴黎公社不是世界上第一个社会主义国家；第一个社会主义国家由俄国十月革命后建立。"],"第一次世界大战":["【根本背景】第二次工业革命后资本主义国家实力变化，政治经济发展不平衡加剧。","【矛盾】列强围绕殖民地、市场和战略利益竞争，形成两大军事集团。","【导火索】1914年萨拉热窝事件。","【性质】总体上是帝国主义列强争夺世界霸权和殖民地的战争。","【影响】造成巨大伤亡和经济破坏，欧洲实力下降，民族解放运动和社会主义运动发展，并催生新的国际秩序。"],"俄国十月革命":["【背景】俄国社会矛盾深重，一战使危机激化；二月革命后临时政府继续参战。","【过程】1917年二月革命推翻沙皇专制；十月革命推翻资产阶级临时政府。","【政权】建立苏维埃政权，世界上第一个社会主义国家诞生。","【影响】打破资本主义制度一统天下局面，鼓舞国际工人运动和殖民地民族解放运动。","【辨析】二月革命与十月革命的对象、性质和结果要分清。"],"凡尔赛—华盛顿体系":["【巴黎和会】战胜国围绕战后欧洲和殖民地利益重新分配，签订《凡尔赛条约》等。","【华盛顿会议】主要协调列强在亚太地区的利益和海军军备问题。","【体系】共同构成一战后的国际关系格局。","【局限】体系建立在战胜国强权政治和利益重新分配基础上，没有消除列强间根本矛盾。","【中国】巴黎和会山东问题直接引发中国五四运动。"],"资本主义经济大危机":["【时间】1929—1933年，从美国迅速扩展到整个资本主义世界。","【原因】生产社会化与资本主义私人占有矛盾、贫富差距、生产相对过剩和金融投机等共同作用。","【特点】范围广、持续时间长、破坏性大。","【影响】企业倒闭、银行破产、失业激增、社会矛盾激化。","【政治后果】美国走向罗斯福新政，德日等国法西斯势力扩张，国际局势更加紧张。"],"罗斯福新政":["【金融】整顿银行和金融体系，恢复公众信心。","【工业农业】政府通过法规、补贴和生产调节干预经济。","【社会】实施公共工程和社会保障措施，缓解失业和社会矛盾。","【核心】在不改变资本主义制度前提下，加强国家对经济和社会生活的干预。","【评价】缓解危机、稳定社会并开创国家宏观干预新模式，但不能根除资本主义基本矛盾。"],"第二次世界大战":["【原因】凡尔赛—华盛顿体系矛盾、经济大危机、法西斯国家扩张和西方绥靖政策共同作用。","【爆发】1939年德国进攻波兰，欧洲战争全面爆发。","【扩大】1941年德国进攻苏联；日本袭击珍珠港后太平洋战争全面爆发，美国参战。","【同盟】1942年世界反法西斯同盟正式形成，战争性质更加明确。","【结果影响】1945年反法西斯战争胜利；欧洲衰落、美苏崛起，联合国建立，殖民体系瓦解和冷战格局形成。"],"布雷顿森林体系与联合国":["【布雷顿森林】以美元为中心建立战后国际货币金融体系，国际货币基金组织和世界银行成为重要机构。","【目标】稳定汇率、恢复国际贸易和投资秩序，美国在体系中居主导地位。","【联合国】1945年成立，宗旨是维护国际和平与安全、促进国际合作。","【结构】安理会五个常任理事国拥有否决权，是战后大国协调机制的重要体现。"],"冷战开始":["【原因】二战后美苏国家利益、安全战略和意识形态矛盾迅速上升。","【开始标志】1947年杜鲁门主义出台，通常被视为冷战正式开始。","【经济】马歇尔计划援助西欧，同时加强美国对西欧经济政治影响。","【表现】德国分裂、军备竞赛、意识形态对抗以及世界范围阵营竞争。","【辨析】冷战强调美苏避免直接全面战争，但并不意味着没有朝鲜战争、越南战争等局部热战。"],"北约与华约":["【北约】1949年美国与西欧国家建立北大西洋公约组织。","【华约】1955年苏联和东欧国家建立华沙条约组织。","【意义】欧洲出现两大军事政治集团全面对峙，两极格局正式形成。","【影响】国际关系长期处于阵营化、军事化和核威慑状态。"],"亚非拉民族解放与殖民体系瓦解":["【背景】二战削弱殖民国家，民族意识和民族力量增强，联合国民族自决原则影响扩大。","【亚洲】印度独立等标志亚洲民族解放运动取得重大成果。","【非洲】1960年有17个非洲国家独立，被称为“非洲年”；1990年纳米比亚独立具有重要象征意义。","【影响】世界殖民体系基本瓦解，发展中国家成为国际政治重要力量。"],"欧洲一体化":["【背景】二战后欧洲衰落、美苏竞争以及恢复经济和避免战争的共同需要。","【过程】欧洲煤钢共同体 → 欧洲经济共同体等 → 1993年欧洲联盟正式成立。","【特点】从经济合作逐步扩展到政治、法律和社会等更广领域。","【影响】增强欧洲整体实力，是战后世界多极化趋势的重要表现之一。"],"苏联解体与两极格局瓦解":["【内部原因】经济体制长期僵化、政治体制问题、民族矛盾和改革失控等共同作用。","【外部因素】长期军备竞争和西方压力加重苏联负担，但不能作为唯一原因。","【时间】1991年苏联解体，冷战基本结束，两极格局瓦解。","【国际格局】美国成为唯一超级大国，但欧盟、中国、日本、俄罗斯等力量发展，多极化趋势继续加强。","【辨析】“两极格局瓦解”不等于“多极格局已经形成”。"],"经济全球化与多极化趋势":["【全球化表现】国际贸易、跨国投资、跨国公司、全球产业链和信息网络快速发展。","【制度】WTO等国际经济组织推动贸易规则和市场联系进一步全球化。","【动力】科技革命、交通通信进步、市场经济扩展和跨国公司发展。","【问题】全球化带来增长机会，也加剧发展不平衡、金融风险、环境压力和产业冲击。","【格局】冷战后世界政治力量更加多元，多极化是发展趋势而非已经完成的固定格局。"]};
EVENTS.forEach(e=>{e.deepPoints=DEEP_POINTS[e.title]||e.points.map(x=>"【核心】"+x+"：结合本事件的背景、内容与影响理解，并注意其在本阶段时间线中的位置。");});
const SYSTEMS=[{"title":"中国古代政治制度主线","desc":"西周分封宗法 → 秦皇帝/郡县 → 汉强化中央集权 → 隋唐三省六部 → 宋分割相权与地方权力 → 元行省 → 明废丞相 → 清军机处","takeaway":"总趋势：中央权力不断加强，地方权力相对削弱；皇权不断加强，相权不断削弱。"},{"title":"中国经济重心南移","desc":"魏晋南北朝江南开发 → 唐安史之乱后南移加快 → 南宋时期基本完成","takeaway":"常考原因：北方战乱、人口南迁、技术与劳动力输入、南方自然条件、相对稳定。"},{"title":"中国近代救亡探索","desc":"开眼看世界 → 洋务运动（器物）→ 戊戌/辛亥（制度）→ 新文化（思想）→ 五四 → 马克思主义传播 → 中共成立","takeaway":"核心大题：为什么探索不断深化？前一阶段道路受挫 + 民族危机加深 + 社会力量变化。"},{"title":"中国革命道路","desc":"五四 → 中共成立 → 国民革命 → 1927转折 → 井冈山道路 → 长征/遵义 → 抗日民族统一战线 → 解放战争 → 1949","takeaway":"核心：从照搬城市中心道路转向农村包围城市，逐步形成适合中国国情的革命道路。"},{"title":"中国现代化","desc":"洋务早期工业化尝试 → 民族工业发展 → 一五计划 → 社会主义建设探索 → 1978改革开放 → 1992市场经济目标 → 2001加入WTO → 当代现代化建设","takeaway":"可串联工业化、经济体制、开放程度、国家能力四个维度。"},{"title":"世界市场形成","desc":"新航路开辟（开始）→ 殖民扩张（扩大）→ 第一次工业革命（基本形成）→ 第二次工业革命（最终形成）→ 20世纪经济全球化","takeaway":"高频比较：世界联系加强与殖民掠夺、市场扩张同时发生。"},{"title":"西方思想解放","desc":"文艺复兴（人文主义）→ 宗教改革（冲击教权）→ 科学革命 → 启蒙运动（理性主义）→ 资产阶级革命与制度建设","takeaway":"思想变化与社会经济、政治制度转型互相推动。"},{"title":"国际秩序演变","desc":"一战 → 凡尔赛—华盛顿体系 → 二战 → 雅尔塔体系/联合国 → 冷战与两极格局 → 1991两极瓦解 → 多极化趋势","takeaway":"常考：国际秩序是力量对比变化的结果，并会反过来影响国际关系。"}];
const state={side:"全部",star:0,q:"",view:"timeline"};
const norm=s=>(s||"").toLowerCase().replace(/\s+/g,"");
const stars=n=>"★".repeat(n)+"☆".repeat(3-n);
const host=document.getElementById("timelineHost");
const detail=document.getElementById("detail");
let cards=[],searchTimer=null,lastScrollY=0;

function buildTimeline(){
 const frag=document.createDocumentFragment();
 let lastKey="";
 EVENTS.forEach((e,i)=>{
   const key=e.side+"|"+e.era;
   if(key!==lastKey){
     const g=document.createElement("section");g.className="group";g.dataset.group=key;g.dataset.era=e.era;
     g.innerHTML=`<div class="group-head"><h2>${e.side} · ${e.era}</h2><span class="gcount"></span></div><div class="timeline"></div>`;
     frag.appendChild(g);lastKey=key;
   }
   const group=frag.lastChild.querySelector(".timeline");
   const a=document.createElement("article");a.className="event";a.dataset.i=i;a.dataset.side=e.side;a.dataset.star=e.importance;
   a.dataset.search=norm([e.title,e.date,e.era,e.summary,...e.points,...e.deepPoints,...e.links,...e.keywords].join(" "));
   a.innerHTML=`<div class="e-row"><div class="e-date">${e.date}</div><div class="e-title">${e.title}</div><div class="e-star">${stars(e.importance)}</div></div><div class="e-summary">${e.summary}</div><div class="chips">${e.points.slice(0,3).map(x=>`<span class="chip">${x}</span>`).join("")}</div>`;
   group.appendChild(a);
 });
 host.appendChild(frag);
 cards=[...document.querySelectorAll(".event")];
 cards.forEach(c=>c.addEventListener("click",()=>openDetail(+c.dataset.i)));
 applyFilter();
}
function applyFilter(){
 const q=norm(state.q);let total=0;
 cards.forEach(c=>{
   const okSide=state.side==="全部"||c.dataset.side===state.side;
   const okStar=!state.star||+c.dataset.star>=state.star;
   const okQ=!q||c.dataset.search.includes(q);
   const show=okSide&&okStar&&okQ;c.classList.toggle("hidden",!show);if(show)total++;
 });
 document.querySelectorAll(".group").forEach(g=>{
   const visible=[...g.querySelectorAll(".event:not(.hidden)")].length;
   g.classList.toggle("hidden",visible===0);g.querySelector(".gcount").textContent=visible+" 个节点";
 });
 if(!document.getElementById("empty")){
   const d=document.createElement("div");d.id="empty";d.className="empty hidden";d.textContent="没有匹配结果";host.appendChild(d);
 }
 document.getElementById("empty").classList.toggle("hidden",total!==0);
}
function openDetail(i,push=true){
 const e=EVENTS[i];if(!e)return;
 lastScrollY=window.scrollY;
 document.getElementById("detailStar").textContent=stars(e.importance);
 document.getElementById("detailMain").innerHTML=`
  <div class="d-meta">${e.side} · ${e.era} · ${e.date}</div>
  <h2 class="d-title">${e.title}</h2>
  <div class="d-summary">${e.summary}</div>
  <div class="d-grid">
   <section class="d-card fastbox full"><h3>30秒核心定位</h3><p>${e.summary}</p></section>
   <section class="d-card"><h3>为什么发生</h3><p>${e.background}</p></section>
   <section class="d-card full"><h3>细分考点 · 必背知识点</h3><ul>${e.deepPoints.map(x=>`<li>${x}</li>`).join("")}</ul></section>
   <section class="d-card"><h3>选择题陷阱</h3><ul>${e.pitfalls.map(x=>`<li>${x}</li>`).join("")}</ul></section>
   <section class="d-card"><h3>材料题怎么问</h3><ul>${e.questions.map(x=>`<li>${x}</li>`).join("")}</ul></section>
   <section class="d-card full"><h3>答题关键词</h3><div class="keyword-wrap">${e.keywords.map(x=>`<span class="keyword">${x}</span>`).join("")}</div></section>
   <section class="d-card full"><h3>可串联时间线</h3><div class="linkline">${e.links.map(x=>`<span class="linkpill">${x}</span>`).join("")}</div></section>
  </div>`;
 detail.classList.add("open");detail.setAttribute("aria-hidden","false");detail.scrollTop=0;document.body.style.overflow="hidden";
 if(push) history.pushState({event:i},"","#event-"+i);
}
function closeDetail(push=true){
 detail.classList.remove("open");detail.setAttribute("aria-hidden","true");document.body.style.overflow="";
 setTimeout(()=>window.scrollTo(0,lastScrollY),0);
 if(push&&location.hash.startsWith("#event-"))history.pushState({},"",location.pathname+location.search);
}
document.getElementById("backBtn").onclick=()=>history.back();
window.addEventListener("popstate",()=>{
 const m=location.hash.match(/^#event-(\d+)$/);
 if(m) openDetail(+m[1],false); else closeDetail(false);
});
function showView(v){
 state.view=v;
 document.querySelectorAll(".view").forEach(x=>x.classList.toggle("active",x.id===v+"View"));
 document.querySelectorAll("[data-view]").forEach(x=>x.classList.toggle("active",x.dataset.view===v));
 document.getElementById("tools").style.display=v==="timeline"?"flex":"none";
 window.scrollTo({top:0,behavior:"smooth"});
}
document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>showView(b.dataset.view));
document.getElementById("search").addEventListener("input",e=>{
 state.q=e.target.value;clearTimeout(searchTimer);searchTimer=setTimeout(applyFilter,90);
});
document.querySelectorAll("#sideSeg button").forEach(b=>b.onclick=()=>{
 document.querySelectorAll("#sideSeg button").forEach(x=>x.classList.remove("active"));b.classList.add("active");state.side=b.dataset.side;applyFilter();
});
document.querySelectorAll("#starSeg button").forEach(b=>b.onclick=()=>{
 document.querySelectorAll("#starSeg button").forEach(x=>x.classList.remove("active"));b.classList.add("active");state.star=+b.dataset.star;applyFilter();
});
function buildSystems(){
 document.getElementById("systemHost").innerHTML=SYSTEMS.map(s=>`<article class="system"><h3>${s.title}</h3><p>${s.desc}</p><p class="take">${s.takeaway}</p></article>`).join("");
}
function buildNav(){
 for(const side of ["中国史","世界史"]){
  const id=side==="中国史"?"chinaNav":"worldNav";const eras=[...new Set(EVENTS.filter(e=>e.side===side).map(e=>e.era))];
  document.getElementById(id).innerHTML=eras.map(e=>`<button class="era-btn" data-era="${e}">${e}</button>`).join("");
 }
 document.querySelectorAll(".era-btn").forEach(b=>b.onclick=()=>{
  showView("timeline");const g=[...document.querySelectorAll(".group")].find(x=>x.dataset.era===b.dataset.era&&!x.classList.contains("hidden"));
  if(g)g.scrollIntoView({behavior:"smooth",block:"start"});
 });
}
function buildCompare(){
 const bands=[
  ["古代世界",-9999,1399],["走向近代",1400,1759],["工业化与近代中国",1760,1913],
  ["世界大战与中国革命",1914,1948],["冷战与新中国",1949,1977],["改革开放与全球化",1978,9999]
 ];
 document.getElementById("compareHost").innerHTML=bands.map(([name,a,b])=>{
  const cn=EVENTS.filter(e=>e.side==="中国史"&&e.year>=a&&e.year<=b&&e.importance>=2).slice(0,10);
  const wd=EVENTS.filter(e=>e.side==="世界史"&&e.year>=a&&e.year<=b&&e.importance>=2).slice(0,10);
  const list=x=>x.map(e=>`<div class="c-item"><b>${e.title}</b><span>${e.date} · ${stars(e.importance)}</span></div>`).join("")||'<div class="c-item"><span>本阶段暂无核心节点</span></div>';
  return `<div class="group-head"><h2>${name}</h2><span>${a<0?"古代":a+"—"+(b>9000?"现在":b)}</span></div><div class="compare-grid"><section class="compare-col"><h3>中国史</h3>${list(cn)}</section><section class="compare-col"><h3>世界史</h3>${list(wd)}</section></div>`;
 }).join("");
}
function scrollProgress(){
 const d=document.documentElement;const max=d.scrollHeight-d.clientHeight;
 document.getElementById("progress").style.width=(max?d.scrollTop/max*100:0)+"%";
}
window.addEventListener("scroll",scrollProgress,{passive:true});
document.getElementById("eventCount").textContent=EVENTS.length;
buildTimeline();buildSystems();buildNav();buildCompare();
const initial=location.hash.match(/^#event-(\d+)$/);if(initial)openDetail(+initial[1],false);
</script>
</body>
</html>
