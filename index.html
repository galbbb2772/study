<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f8fa">
<title>高三历史总复习 · 时间轴</title>
<style>
:root{
 --bg:#f7f8fa;--card:#fff;--text:#15171a;--sub:#66707b;--line:#e7e9ed;
 --soft:#f1f3f5;--ink:#111827;--shadow:0 12px 36px rgba(17,24,39,.07);
 --r:18px;--top:70px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--bg)}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input{font:inherit}
button{touch-action:manipulation}
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:rgba(255,255,255,.92);backdrop-filter:blur(18px);border-right:1px solid var(--line);padding:24px 16px;overflow:auto;overscroll-behavior:contain}
.logo{font-size:19px;font-weight:850;letter-spacing:-.5px;padding:0 8px}
.logo small{display:block;font-size:11px;font-weight:600;color:#9aa1aa;letter-spacing:.08em;margin-top:5px}
.nav{margin-top:24px;display:grid;gap:5px}
.nav button,.era-btn{border:0;background:transparent;text-align:left;padding:10px 11px;border-radius:11px;color:#56606b;cursor:pointer}
.nav button:hover,.nav button.active,.era-btn:hover{background:#f0f2f4;color:#111}
.nav button.active{font-weight:750}
.side-title{font-size:10px;letter-spacing:.15em;color:#9ba2aa;text-transform:uppercase;margin:22px 10px 7px}
.era-btn{display:block;width:100%;font-size:12px;padding:7px 11px}
.main{min-width:0;width:100%;max-width:1320px;margin:auto;padding:24px 30px 80px}
.hero{background:linear-gradient(145deg,#fff,#fbfbfc);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:var(--shadow)}
.eyebrow{font-size:11px;letter-spacing:.13em;color:#9aa1aa;font-weight:750}
h1{font-size:31px;line-height:1.15;letter-spacing:-1px;margin:8px 0 9px}
.hero p{margin:0;color:var(--sub);line-height:1.75;font-size:14px}
.stats{display:flex;gap:20px;margin-top:22px;flex-wrap:wrap}
.stat b{font-size:20px}.stat span{display:block;font-size:11px;color:#9299a2;margin-top:2px}
.tools{position:sticky;top:0;z-index:4;padding:12px 0;background:rgba(247,248,250,.9);backdrop-filter:blur(16px);display:flex;gap:9px;flex-wrap:wrap}
.search{flex:1;min-width:210px;background:#fff;border:1px solid var(--line);outline:none;padding:11px 13px;border-radius:12px;transition:border .15s,box-shadow .15s}
.search:focus{border-color:#cfd4da;box-shadow:0 0 0 4px rgba(17,24,39,.035)}
.segment{display:flex;background:#eceff2;padding:4px;border-radius:12px}
.segment button{border:0;background:transparent;padding:7px 10px;border-radius:8px;color:#626b75;cursor:pointer;white-space:nowrap;font-size:13px}
.segment button.active{background:#fff;color:#111;box-shadow:0 1px 3px rgba(0,0,0,.06);font-weight:750}
.view{display:none}.view.active{display:block;animation:fade .16s ease both}
@keyframes fade{from{opacity:.45;transform:translateY(3px)}to{opacity:1;transform:none}}
.group{content-visibility:auto;contain-intrinsic-size:1px 700px}
.group-head{display:flex;align-items:end;justify-content:space-between;padding:23px 3px 10px}
.group-head h2{font-size:19px;letter-spacing:-.35px;margin:0}
.group-head span{font-size:11px;color:#9aa1aa}
.timeline{position:relative;padding-left:29px}
.timeline:before{content:"";position:absolute;left:7px;top:0;bottom:4px;width:1px;background:#dde1e5}
.event{position:relative;background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px 16px;margin-bottom:9px;cursor:pointer;transition:transform .12s ease,border-color .12s ease,box-shadow .12s ease;contain:content}
.event:before{content:"";position:absolute;left:-27px;top:22px;width:8px;height:8px;border-radius:50%;background:#252a31;border:3px solid var(--bg)}
.event:hover{transform:translateY(-1px);border-color:#d3d7dc;box-shadow:0 7px 22px rgba(17,24,39,.055)}
.event:active{transform:scale(.997)}
.e-row{display:grid;grid-template-columns:104px 1fr auto;gap:11px;align-items:start}
.e-date{font-size:11px;color:#8f969f;padding-top:2px}
.e-title{font-size:15px;font-weight:790;letter-spacing:-.15px}
.e-star{font-size:11px;letter-spacing:.5px}
.e-summary{margin:8px 0 0 115px;color:#66707b;font-size:13px;line-height:1.6}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0 0 115px}
.chip{font-size:10px;padding:4px 7px;border:1px solid #eceef0;border-radius:99px;background:#f6f7f8;color:#626b75}
.hidden{display:none!important}
.empty{text-align:center;color:#9aa1aa;padding:70px 10px}
.system-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
.system{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;content-visibility:auto}
.system h3{margin:0 0 9px;font-size:15px}.system p{font-size:13px;line-height:1.75;color:#626b75;margin:0}
.system .take{border-top:1px dashed var(--line);margin-top:11px;padding-top:11px;color:#20252a;font-weight:650}
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.compare-col{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}
.compare-col h3{margin:0 0 12px;font-size:15px}
.c-item{padding:10px 0;border-top:1px solid #f0f1f3}.c-item:first-of-type{border-top:0}
.c-item b{display:block;font-size:13px}.c-item span{font-size:11px;color:#8d949d}
.detail{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;transform:translateX(102%);transition:transform .22s cubic-bezier(.2,.8,.2,1);will-change:transform}
.detail.open{transform:none}
.detail-top{position:sticky;top:0;z-index:2;background:rgba(247,248,250,.9);backdrop-filter:blur(18px);border-bottom:1px solid rgba(231,233,237,.8)}
.detail-bar{max-width:920px;margin:auto;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.back{border:0;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 11px;cursor:pointer}
.detail-main{max-width:920px;margin:auto;padding:35px 20px 90px}
.d-meta{font-size:12px;color:#8f969f;margin-bottom:8px}.d-title{font-size:32px;font-weight:870;letter-spacing:-1px;line-height:1.15;margin:0}
.d-summary{font-size:16px;color:#59636e;line-height:1.85;margin:15px 0 25px}
.d-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.d-card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px;min-width:0}
.d-card.full{grid-column:1/-1}.d-card h3{font-size:12px;letter-spacing:.09em;color:#8c939c;margin:0 0 11px}
.d-card p,.d-card li{font-size:14px;line-height:1.8;color:#353b43}
.d-card p{margin:0}.d-card ul{margin:0;padding-left:18px}
.keyword-wrap{display:flex;gap:7px;flex-wrap:wrap}
.keyword{background:#111827;color:#fff;border-radius:999px;padding:6px 9px;font-size:11px}
.linkline{display:flex;gap:6px;flex-wrap:wrap}
.linkpill{background:#f2f4f6;border:1px solid #e8eaed;border-radius:9px;padding:7px 9px;font-size:12px;color:#414952}
.fastbox{background:#111827;color:#fff!important;border:0}.fastbox h3{color:#aeb6c0}.fastbox p{color:#fff;font-size:15px;font-weight:650}
.progress{position:fixed;left:0;top:0;height:2px;background:#111827;z-index:50;width:0}
.mobile-tabs{display:none}
@media(max-width:820px){
 .shell{display:block}.side{display:none}.main{padding:12px 12px 90px}.hero{padding:22px 17px;border-radius:19px}
 h1{font-size:26px}.tools{top:0;padding:9px 0}.search{width:100%;flex-basis:100%}
 .e-row{grid-template-columns:86px 1fr auto}.e-summary,.chips{margin-left:97px}
 .system-grid,.d-grid,.compare-grid{grid-template-columns:1fr}.d-card.full{grid-column:auto}
 .d-title{font-size:28px}.detail-main{padding:25px 14px 80px}.detail-bar{padding:0 14px}
 .mobile-tabs{position:fixed;display:grid;grid-template-columns:repeat(3,1fr);left:10px;right:10px;bottom:10px;z-index:8;background:rgba(255,255,255,.92);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:15px;padding:5px;box-shadow:0 10px 30px rgba(0,0,0,.1)}
 .mobile-tabs button{border:0;background:transparent;border-radius:10px;padding:9px 5px;font-size:12px;color:#69727c}
 .mobile-tabs button.active{background:#f0f2f4;color:#111;font-weight:750}
}
@media(max-width:520px){
 .e-row{grid-template-columns:76px 1fr auto;gap:8px}.e-summary,.chips{margin-left:84px}
 .segment button{padding:7px 8px}.hero p br{display:none}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
</head>

<div class="progress" id="progress"></div>
<div class="shell">
<aside class="side">
 <div class="logo">历史总复习<small>CHINA × WORLD · TIMELINE</small></div>
 <div class="nav">
  <button class="active" data-view="timeline">总时间轴</button>
  <button data-view="systems">体系主线</button>
  <button data-view="compare">中外同期</button>
 </div>

 <div class="side-title">世界史阶段</div><div id="worldNav"></div>

<main class="main">
 <section class="hero">

  <div class="stats"><div class="stat"><b id="eventCount"></b><span>知识节点</span></div><div class="stat"><b>8</b><span>核心体系</span></div><div class="stat"><b>3级</b><span>重要度</span></div></div>
 </section>
 <div class="tools" id="tools">

  <div class="segment" id="starSeg"><button class="active" data-star="0">全部</button><button data-star="3">★★★</button><button data-star="2">★★+</button></div>
 </div>
 <section class="view active" id="timelineView"><div id="timelineHost"></div></section>
 <section class="view" id="systemsView"><div class="group-head"><h2>体系主线</h2><span>大题串联</span></div><div class="system-grid" id="systemHost"></div></section>
 <section class="view" id="compareView"><div class="group-head"><h2>中外同期对照</h2><span>同一时代一起看</span></div><div id="compareHost"></div></section>
</main>
</div>
<div class="mobile-tabs">
 <button class="active" data-view="timeline">时间线</button><button data-view="systems">体系</button><button data-view="compare">中外同期</button>
</div>

<section class="detail" id="detail" aria-hidden="true">
 <div class="detail-top"><div class="detail-bar"><button class="back" id="backBtn">← 返回总览</button><span id="detailStar"></span></div></div>
 <main class="detail-main" id="detailMain"></main>
</section>

const state={side:"全部",star:0,q:"",view:"timeline"};
const norm=s=>(s||"").toLowerCase().replace(/\s+/g,"");
const stars=n=>"★".repeat(n)+"☆".repeat(3-n);
const host=document.getElementById("timelineHost");
const detail=document.getElementById("detail");
let cards=[],searchTimer=null,lastScrollY=0;

function buildTimeline(){
 const frag=document.createDocumentFragment();
 let lastKey="";
 EVENTS.forEach((e,i)=>{
   const key=e.side+"|"+e.era;
   if(key!==lastKey){
     const g=document.createElement("section");g.className="group";g.dataset.group=key;g.dataset.era=e.era;
     g.innerHTML=`<div class="group-head"><h2>${e.side} · ${e.era}</h2><span class="gcount"></span></div><div class="timeline"></div>`;
     frag.appendChild(g);lastKey=key;
   }
   const group=frag.lastChild.querySelector(".timeline");
   const a=document.createElement("article");a.className="event";a.dataset.i=i;a.dataset.side=e.side;a.dataset.star=e.importance;
   a.dataset.search=norm([e.title,e.date,e.era,e.summary,...e.points,...e.links,...e.keywords].join(" "));
   a.innerHTML=`<div class="e-row"><div class="e-date">${e.date}</div><div class="e-title">${e.title}</div><div class="e-star">${stars(e.importance)}</div></div><div class="e-summary">${e.summary}</div><div class="chips">${e.points.slice(0,3).map(x=>`<span class="chip">${x}</span>`).join("")}</div>`;
   group.appendChild(a);
 });
 host.appendChild(frag);
 cards=[...document.querySelectorAll(".event")];
 cards.forEach(c=>c.addEventListener("click",()=>openDetail(+c.dataset.i)));
 applyFilter();
}
function applyFilter(){
 const q=norm(state.q);let total=0;
 cards.forEach(c=>{
   const okSide=state.side==="全部"||c.dataset.side===state.side;
   const okStar=!state.star||+c.dataset.star>=state.star;
   const okQ=!q||c.dataset.search.includes(q);
   const show=okSide&&okStar&&okQ;c.classList.toggle("hidden",!show);if(show)total++;
 });
 document.querySelectorAll(".group").forEach(g=>{
   const visible=[...g.querySelectorAll(".event:not(.hidden)")].length;
   g.classList.toggle("hidden",visible===0);g.querySelector(".gcount").textContent=visible+" 个节点";
 });
 if(!document.getElementById("empty")){
   const d=document.createElement("div");d.id="empty";d.className="empty hidden";d.textContent="没有匹配结果";host.appendChild(d);
 }
 document.getElementById("empty").classList.toggle("hidden",total!==0);
}
function openDetail(i,push=true){
 const e=EVENTS[i];if(!e)return;
 lastScrollY=window.scrollY;
 document.getElementById("detailStar").textContent=stars(e.importance);
 document.getElementById("detailMain").innerHTML=`
  <div class="d-meta">${e.side} · ${e.era} · ${e.date}</div>
  <h2 class="d-title">${e.title}</h2>
  <div class="d-summary">${e.summary}</div>
  <div class="d-grid">
   <section class="d-card fastbox full"><h3>30秒核心定位</h3><p>${e.summary}</p></section>
   <section class="d-card"><h3>为什么发生</h3><p>${e.background}</p></section>
   <section class="d-card"><h3>细分考点</h3><ul>${e.points.map(x=>`<li>${x}</li>`).join("")}</ul></section>
   <section class="d-card"><h3>选择题陷阱</h3><ul>${e.pitfalls.map(x=>`<li>${x}</li>`).join("")}</ul></section>
   <section class="d-card"><h3>材料题怎么问</h3><ul>${e.questions.map(x=>`<li>${x}</li>`).join("")}</ul></section>
   <section class="d-card full"><h3>答题关键词</h3><div class="keyword-wrap">${e.keywords.map(x=>`<span class="keyword">${x}</span>`).join("")}</div></section>
   <section class="d-card full"><h3>可串联时间线</h3><div class="linkline">${e.links.map(x=>`<span class="linkpill">${x}</span>`).join("")}</div></section>
  </div>`;
 detail.classList.add("open");detail.setAttribute("aria-hidden","false");detail.scrollTop=0;document.body.style.overflow="hidden";
 if(push) history.pushState({event:i},"","#event-"+i);
}
function closeDetail(push=true){
 detail.classList.remove("open");detail.setAttribute("aria-hidden","true");document.body.style.overflow="";
 setTimeout(()=>window.scrollTo(0,lastScrollY),0);
 if(push&&location.hash.startsWith("#event-"))history.pushState({},"",location.pathname+location.search);
}
document.getElementById("backBtn").onclick=()=>history.back();
window.addEventListener("popstate",()=>{
 const m=location.hash.match(/^#event-(\d+)$/);
 if(m) openDetail(+m[1],false); else closeDetail(false);
});
function showView(v){
 state.view=v;
 document.querySelectorAll(".view").forEach(x=>x.classList.toggle("active",x.id===v+"View"));
 document.querySelectorAll("[data-view]").forEach(x=>x.classList.toggle("active",x.dataset.view===v));
 document.getElementById("tools").style.display=v==="timeline"?"flex":"none";
 window.scrollTo({top:0,behavior:"smooth"});
}
document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>showView(b.dataset.view));
document.getElementById("search").addEventListener("input",e=>{
 state.q=e.target.value;clearTimeout(searchTimer);searchTimer=setTimeout(applyFilter,90);
});
document.querySelectorAll("#sideSeg button").forEach(b=>b.onclick=()=>{
 document.querySelectorAll("#sideSeg button").forEach(x=>x.classList.remove("active"));b.classList.add("active");state.side=b.dataset.side;applyFilter();
});
document.querySelectorAll("#starSeg button").forEach(b=>b.onclick=()=>{
 document.querySelectorAll("#starSeg button").forEach(x=>x.classList.remove("active"));b.classList.add("active");state.star=+b.dataset.star;applyFilter();
});
function buildSystems(){
 document.getElementById("systemHost").innerHTML=SYSTEMS.map(s=>`<article class="system"><h3>${s.title}</h3><p>${s.desc}</p><p class="take">${s.takeaway}</p></article>`).join("");
}
function buildNav(){
 for(const side of ["中国史","世界史"]){
  const id=side==="中国史"?"chinaNav":"worldNav";const eras=[...new Set(EVENTS.filter(e=>e.side===side).map(e=>e.era))];
  document.getElementById(id).innerHTML=eras.map(e=>`<button class="era-btn" data-era="${e}">${e}</button>`).join("");
 }
 document.querySelectorAll(".era-btn").forEach(b=>b.onclick=()=>{
  showView("timeline");const g=[...document.querySelectorAll(".group")].find(x=>x.dataset.era===b.dataset.era&&!x.classList.contains("hidden"));
  if(g)g.scrollIntoView({behavior:"smooth",block:"start"});
 });
}
function buildCompare(){
 const bands=[
  ["古代世界",-9999,1399],["走向近代",1400,1759],["工业化与近代中国",1760,1913],
  ["世界大战与中国革命",1914,1948],["冷战与新中国",1949,1977],["改革开放与全球化",1978,9999]
 ];
 document.getElementById("compareHost").innerHTML=bands.map(([name,a,b])=>{
  const cn=EVENTS.filter(e=>e.side==="中国史"&&e.year>=a&&e.year<=b&&e.importance>=2).slice(0,10);
  const wd=EVENTS.filter(e=>e.side==="世界史"&&e.year>=a&&e.year<=b&&e.importance>=2).slice(0,10);
  const list=x=>x.map(e=>`<div class="c-item"><b>${e.title}</b><span>${e.date} · ${stars(e.importance)}</span></div>`).join("")||'<div class="c-item"><span>本阶段暂无核心节点</span></div>';
  return `<div class="group-head"><h2>${name}</h2><span>${a<0?"古代":a+"—"+(b>9000?"现在":b)}</span></div><div class="compare-grid"><section class="compare-col"><h3>中国史</h3>${list(cn)}</section><section class="compare-col"><h3>世界史</h3>${list(wd)}</section></div>`;
 }).join("");
}
function scrollProgress(){
 const d=document.documentElement;const max=d.scrollHeight-d.clientHeight;
 document.getElementById("progress").style.width=(max?d.scrollTop/max*100:0)+"%";
}
window.addEventListener("scroll",scrollProgress,{passive:true});
document.getElementById("eventCount").textContent=EVENTS.length;
buildTimeline();buildSystems();buildNav();buildCompare();
const initial=location.hash.match(/^#event-(\d+)$/);if(initial)openDetail(+initial[1],false);
</script>
</body>
</html>
